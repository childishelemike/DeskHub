<mat-toolbar class="admin-toolbar">
  <button mat-icon-button (click)="goToDashboard()" aria-label="Volver">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <div class="toolbar-title">
    <mat-icon>group</mat-icon>
    <span>Gestión de usuarios</span>
  </div>
  <span class="spacer"></span>
  <button mat-flat-button class="new-button" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Nuevo usuario
  </button>
</mat-toolbar>

<div class="admin-content">
  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Cargando usuarios...</p>
    </div>
  } @else if (users().length === 0) {
    <div class="empty-state">
      <mat-icon>group</mat-icon>
      <p>Aún no hay usuarios registrados.</p>
    </div>
  } @else {
    <div class="table-card">
      <table mat-table [dataSource]="users()" class="users-table">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let user">{{ user.fullName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Correo</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip class="role-chip">{{ user.roleName }}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="office">
          <th mat-header-cell *matHeaderCellDef>Oficina</th>
          <td mat-cell *matCellDef="let user">{{ user.officeName || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button (click)="openEditDialog(user)" aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="deleteUser(user)" aria-label="Eliminar" class="delete-btn">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }
</div>
